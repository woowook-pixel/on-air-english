<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Script</title>
<meta name="description" content="매일 새로 바뀌는 BBC·NPR 영어 뉴스">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;600;700&display=swap">
<link rel="stylesheet" href="design/shared/tokens.css">
<script src="design/shared/symbols.js" defer></script>
<link rel="icon" href="design/shared/icons/script.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="__APPLE_TOUCH_ICON__">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Script">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- 뉴스 팟캐스트는 집계용 리다이렉트를 여러 번 거치므로 미리 연결해 둔다 -->
<link rel="preconnect" href="https://open.live.bbc.co.uk">
<link rel="preconnect" href="https://bbc.pdn.tritondigital.com">
<link rel="preconnect" href="https://prfx.byspotify.com">
<link rel="preconnect" href="https://play.podtrac.com">
<link rel="preconnect" href="https://npr.simplecastaudio.com">
<link rel="preconnect" href="https://ichef.bbci.co.uk">
<link rel="dns-prefetch" href="https://npr.brightspotcdn.com">
<link rel="dns-prefetch" href="https://media.npr.org">
<style>
  html { background: var(--pf-white); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; background: none; border: 0; border-radius: 0; padding: 0; cursor: pointer; text-align: left; }
  a { color: inherit; }
  .pf-screen { max-width: 560px; margin: 0 auto; }
  .sc-row { width: 100%; text-align: left; }
  .pf-action:has(> pf-sym), .pf-update button:has(> pf-sym), .sc-play, .sc-withsym { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .sc-withsym { display: flex; justify-content: flex-start; }
  .sc-arrow { display: inline-flex; align-items: center; }
  .pf-tabbar button { flex-direction: column; gap: 4px; }
  #vbox { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + var(--pf-touch)); height: 1px; opacity: 0; pointer-events: none; overflow: hidden; background: var(--pf-black); z-index: 2; }
  #vbox video { width: 100%; height: 100%; object-fit: contain; }
  body.np-video #vbox { height: min(56.25vw, 315px); opacity: 1; pointer-events: auto; }

  /* ---------- 목록 행 ---------- */
  .sc-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .sc-title { font: 500 16px/1.35 var(--pf-font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sc-sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sc-arrow { flex: none; font: 700 14px/1 var(--pf-font); }
  .sc-row.playing .sc-title { font-weight: 800; }
  .sc-count { font: 700 11px/1 var(--pf-font); letter-spacing: 0.08em; color: var(--pf-gray); }
  .pf-tabs { margin-bottom: 4px; }

  /* ---------- 빈 상태 ---------- */
  .sc-empty { box-shadow: inset 0 1px 0 var(--pf-black); padding: 26px 0; }
  .sc-empty h2 { font: var(--pf-heading); letter-spacing: -0.02em; margin: 0 0 8px; }
  .sc-empty p { margin: 0 0 8px; font: var(--pf-sub); color: var(--pf-gray); }
  .sc-empty button { display: inline-flex; align-items: center; height: var(--pf-touch); font: var(--pf-action); letter-spacing: 0.08em; text-decoration: underline; text-underline-offset: 6px; }

  /* ---------- 썸네일: 흑백, 모서리 없음 ---------- */
  .sc-thumb { flex: none; position: relative; overflow: hidden; background: var(--pf-black); color: var(--pf-white); display: flex; align-items: center; justify-content: center; font: 900 22px/1 var(--pf-font); letter-spacing: -0.02em; }
  .sc-thumb img, .sc-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); }
  .sc-hero { position: relative; overflow: hidden; aspect-ratio: 16 / 9; background: var(--pf-black); margin: 0 0 22px; }

  /* ---------- 기사 ---------- */
  .pf-title.sc-heading { font: var(--pf-heading); letter-spacing: -0.02em; }
  .sc-text p { margin: 0 0 14px; font: var(--pf-body); }
  .sc-note { margin: 4px 0 22px; }

  /* ---------- 재생 화면 ---------- */
  .sc-vspace { height: min(56.25vw, 315px); }
  .sc-info { display: flex; gap: 16px; align-items: flex-end; margin-top: 28px; }
  .sc-meta { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .sc-ptitle { font: 900 32px/1.12 var(--pf-font); letter-spacing: -0.025em; margin: 24px 0 12px; }
  .sc-progress { position: relative; height: var(--pf-touch); touch-action: none; }
  .sc-progress::before { content: ""; position: absolute; left: 0; right: 0; top: 21px; height: 2px; background: var(--pf-line); }
  .sc-pos { position: absolute; top: 16px; left: 0; width: 4px; height: 12px; background: var(--pf-ember); }
  .sc-times { display: flex; justify-content: space-between; font: 700 12px/1 var(--pf-font); font-variant-numeric: tabular-nums; }
  .sc-transport { display: flex; align-items: center; justify-content: space-between; margin: 20px 0 26px; }
  .sc-seek { min-width: var(--pf-touch); text-align: center; }
  .sc-play { min-width: 96px; height: 56px; padding: 0 20px; background: var(--pf-black); color: var(--pf-white); font: 800 13px/1 var(--pf-font); letter-spacing: 0.12em; text-align: center; }

  /* ---------- 미니 플레이어 ---------- */
  .sc-mini { position: fixed; left: 0; right: 0; bottom: calc(var(--pf-tabbar) + var(--sc-update-h, 0px)); height: 56px; display: none; align-items: center; gap: 12px; padding: 0 var(--pf-side); background: var(--pf-white); box-shadow: inset 0 1px 0 var(--pf-line); z-index: 20; }
  body.has-mini .sc-mini { display: flex; }
  .pf-screen { padding-bottom: calc(var(--pf-tabbar) + var(--sc-update-h, 0px) + 24px); }
  body.has-mini .pf-screen { padding-bottom: calc(var(--pf-tabbar) + var(--sc-update-h, 0px) + 56px + 24px); }
  .sc-mini-open { flex: 1; min-width: 0; height: 56px; display: flex; align-items: center; gap: 12px; }
  .sc-dot { flex: none; width: 7px; height: 7px; background: var(--pf-ember); }
  .sc-mini-text { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .sc-mini-label { font: 800 10px/1 var(--pf-font); letter-spacing: 0.12em; }
  .sc-mini-title { font: 500 14px/1.2 var(--pf-font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sc-mini .pf-action { flex: none; min-width: 56px; text-align: right; }

  /* ---------- 알림 ---------- */
  .sc-toast { position: fixed; left: var(--pf-side); right: var(--pf-side); bottom: calc(var(--pf-tabbar) + var(--sc-update-h, 0px) + 12px); padding: 14px 16px; background: var(--pf-black); color: var(--pf-white); font: 700 12px/1.4 var(--pf-font); letter-spacing: 0.04em; opacity: 0; pointer-events: none; z-index: 30; }
  .sc-toast.on { opacity: 1; }
  body.has-mini .sc-toast { bottom: calc(var(--pf-tabbar) + var(--sc-update-h, 0px) + 68px); }
</style>
</head>
<body>
<main id="view" class="pf-screen"></main>

<div class="sc-mini" id="mini">
  <button class="sc-mini-open" id="miniOpen" aria-label="재생 화면 열기">
    <span class="sc-dot" aria-hidden="true"></span>
    <span class="sc-mini-text"><span class="sc-mini-label">NOW PLAYING</span><span class="sc-mini-title" id="miniTitle"></span></span>
  </button>
  <button class="pf-action" id="miniPlay" aria-label="재생"><pf-sym name="play"></pf-sym>PLAY</button>
</div>

<nav class="pf-tabbar" id="tabs" aria-label="메인 메뉴">
  <button data-tab="listen"><pf-sym name="listen"></pf-sym><span>듣기</span></button>
  <button data-tab="read"><pf-sym name="read"></pf-sym><span>읽기</span></button>
  <button data-tab="library"><pf-sym name="archive"></pf-sym><span>보관함</span></button>
</nav>

<div class="pf-update" id="update" role="status" hidden>
  <span class="pf-update-text">새 버전이 있습니다</span>
  <button type="button" class="pf-update-later">나중에</button>
  <button type="button" class="pf-update-reload"><pf-sym name="refresh"></pf-sym>새로고침</button>
</div>

<div id="vbox"><video id="media" playsinline preload="metadata"></video></div>
<div class="sc-toast" id="toast" role="status"></div>

<script>
function h(tag, attrs, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c != null && c !== false) e.append(c);
  return e;
}
const $ = id => document.getElementById(id);

// ---------- 출처 ----------
const SOURCES = {
  'VOA Learning English':         { short: 'VOA',           mark: 'VOA' },
  'manythings.org':               { short: 'VOA',           mark: 'VOA' },
  'NASA Image and Video Library': { short: 'NASA',          mark: 'NASA' },
  'NASA Science':                 { short: 'NASA',          mark: 'NASA' },
  'Global Voices':                { short: 'Global Voices', mark: 'GV' },
  'Simple English Wikipedia':     { short: 'Wikipedia',     mark: 'W' },
  'Wikimedia Commons':            { short: 'Wikimedia',     mark: 'W' },
  'LibriVox':                     { short: 'LibriVox',      mark: 'LV' },
  'Internet Archive (LibriVox)':  { short: 'LibriVox',      mark: 'LV' },
  'BBC':                          { short: 'BBC',           mark: 'BBC' },
  'BBC News':                     { short: 'BBC News',      mark: 'BBC' },
  'NPR':                          { short: 'NPR',           mark: 'NPR' },
};
const src = p => SOURCES[p.sourceName] || { short: p.sourceName || '', mark: (p.show || '?').slice(0, 2) };
const isMedia = p => p.type === 'video';
const kindLabel = p => p.media === 'video' ? '영상' : '오디오';
const keyOf = p => p.src || p.source || p.title;
const prettyShow = s => (s || '').toLowerCase().split(' ').map(w => ['bbc', 'npr', 'voa', 'nasa'].includes(w) ? w.toUpperCase() : w.charAt(0).toUpperCase() + w.slice(1)).join(' ');

function thumb(p, size) {
  const t = h('div', { class: 'sc-thumb', style: `width:${size}px;height:${size}px` }, src(p).mark);
  if (p.image && /^https:\/\//.test(p.image)) {
    const img = h('img', { src: p.image, alt: '', loading: 'lazy', decoding: 'async' });
    img.addEventListener('error', () => img.remove());
    t.append(img);
  }
  return t;
}

function readMinutes(p) {
  const words = (p.paragraphs || []).join(' ').split(/\s+/).length;
  return Math.max(1, Math.round(words / 130));
}
const minutes = p => p.duration ? `${Math.max(1, Math.round(p.duration / 60))}분` : kindLabel(p);
function fmtDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  return `${d.getMonth() + 1}월 ${d.getDate()}일`;
}
function subtitle(p) {
  if (isMedia(p)) return `${src(p).short} · ${minutes(p)}`;
  if (p.type === 'link') return `${src(p).short}${p.date ? ' · ' + fmtDate(p.date) : ''}`;
  return `${src(p).short} · ${readMinutes(p)}분 읽기`;
}
const editionLabel = id => fmtDate(id.slice(0, 10)) + (id.length > 10 ? ` (${id.slice(11)})` : '');
const hasLink = p => p.source && /^https?:\/\//.test(p.source);

// ---------- 저장함 (이 기기에만 저장) ----------
const store = {
  get() { try { return JSON.parse(localStorage.getItem('onair.saved') || '[]'); } catch { return []; } },
  set(list) { try { localStorage.setItem('onair.saved', JSON.stringify(list)); } catch {} },
};
const isSaved = p => store.get().some(x => keyOf(x) === keyOf(p));
function toggleSave(p) {
  const list = store.get();
  const i = list.findIndex(x => keyOf(x) === keyOf(p));
  if (i >= 0) list.splice(i, 1); else list.unshift(p);
  store.set(list);
  return i < 0;
}

// ---------- 데이터 ----------
const state = { latest: null, stack: [], queue: [], current: null, tab: 'listen', lib: 'past' };

async function fetchJSON(url) {
  const r = await fetch(url, { cache: 'no-cache' });
  if (!r.ok) throw new Error(r.status + ' ' + url);
  return r.json();
}

let toastTimer;
function flash(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2200);
}

// ---------- 화면 전환 (스택) ----------
const view = $('view');
const setView = (...nodes) => view.replaceChildren(...nodes.flat().filter(Boolean));
const curFn = () => state.stack[state.stack.length - 1];

function syncChrome() {
  const onPlayer = curFn() === renderPlayer;
  document.body.classList.toggle('has-mini', !!state.current && !onPlayer);
  document.body.classList.toggle('np-video', !!state.current && state.current.media === 'video' && onPlayer);
  document.querySelectorAll('#tabs button').forEach(b => {
    if (b.dataset.tab === state.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
}
function show(fn, push) {
  if (push) {
    state.stack.push(fn);
    history.pushState({ depth: state.stack.length }, '');
  } else {
    state.stack = [fn];
  }
  fn();
  syncChrome();
  window.scrollTo(0, 0);
}
const goBack = () => { if (state.stack.length > 1) history.back(); };
window.addEventListener('popstate', () => {
  if (state.stack.length > 1) {
    state.stack.pop();
    curFn()();
    syncChrome();
    window.scrollTo(0, 0);
  }
});

function setTab(tab) {
  state.tab = tab;
  show(tab === 'listen' ? renderListen : tab === 'read' ? renderRead : renderLibrary, false);
}

// ---------- 공통 부품 ----------
const sym = name => h('pf-sym', { name });
const header = (left, actions) => h('header', { class: 'pf-header' },
  h('div', { class: 'pf-topbar' }, left, actions ? h('div', { class: 'pf-actions' }, actions) : null));
const rootBar = () => header(
  h('span', { class: 'pf-brand' },
    h('span', { class: 'pf-wordmark' }, 'Script'),
    h('picture', null,
      h('source', { srcset: 'design/shared/characters/script-still.png', media: '(prefers-reduced-motion: reduce)' }),
      h('img', { class: 'pf-brand-character', src: 'design/shared/characters/script.gif', alt: '', width: '24', height: '24' }))),
  h('button', { class: 'pf-action', onclick: () => show(renderSettings, true) }, sym('settings'), '설정'));
const backBar = () => header(h('button', { class: 'pf-action', onclick: goBack }, sym('arrow-left'), '목록'));
const titleblock = (eyebrow, title, cls) => h('div', { class: 'pf-titleblock' },
  eyebrow ? h('div', { class: 'pf-eyebrow' }, eyebrow) : null,
  h('h1', { class: 'pf-title' + (cls ? ' ' + cls : '') }, title));
const label = (text, n) => h('div', { class: 'pf-label' }, h('span', null, text), n != null ? h('span', { class: 'sc-count' }, String(n)) : null);
const list = rows => h('div', { class: 'pf-list' }, rows);

function row({ title, sub, key, onSelect }) {
  const b = h('button', { class: 'pf-row sc-row', 'data-key': key || '' },
    h('span', { class: 'sc-body' },
      h('span', { class: 'sc-title' }, title),
      sub ? h('span', { class: 'pf-row-sub sc-sub' }, sub) : null),
    h('span', { class: 'sc-arrow', 'aria-hidden': 'true' }, sym('arrow-right')));
  b.addEventListener('click', onSelect);
  return b;
}
function textRow(text, onSelect, endSym) {
  const b = h('button', { class: 'pf-row sc-row' },
    h('span', { class: 'sc-body' }, h('span', { class: 'sc-title' }, text)),
    endSym ? h('span', { class: 'sc-arrow', 'aria-hidden': 'true' }, sym(endSym)) : null);
  b.addEventListener('click', onSelect);
  return b;
}
function saveRow(p) {
  const holder = h('span', { class: 'sc-title sc-withsym' });
  const draw = on => holder.replaceChildren(sym(on ? 'star-fill' : 'star'), on ? '저장됨' : '저장');
  draw(isSaved(p));
  const b = h('button', { class: 'pf-row sc-row' }, h('span', { class: 'sc-body' }, holder));
  b.addEventListener('click', () => draw(toggleSave(p)));
  return b;
}
function emptyBlock(title, text, actionLabel, onAction) {
  return h('div', { class: 'sc-empty' },
    h('h2', null, title),
    text ? h('p', null, text) : null,
    actionLabel ? h('button', { onclick: onAction }, actionLabel) : null);
}
function markPlaying() {
  const k = state.current && keyOf(state.current);
  view.querySelectorAll('[data-key]').forEach(e => e.classList.toggle('playing', !!k && e.dataset.key === k));
}

// 오늘 목록 불러오기. 실패하면 빈 상태 화면을 보여 주고 false
async function ensureLatest(bar, me) {
  if (state.latest) return true;
  setView(bar(), emptyBlock('불러오는 중…'));
  try { state.latest = await fetchJSON('data/current.json'); }
  catch {
    if (curFn() === me) setView(bar(), emptyBlock('불러오지 못했습니다.', '인터넷 연결을 확인해 주세요.', '다시 시도', () => me()));
    return false;
  }
  return curFn() === me;
}

// ---------- 화면들 ----------
async function renderListen() {
  if (!await ensureLatest(rootBar, renderListen)) return;
  const listening = state.latest.programs.filter(isMedia);
  setView(
    rootBar(),
    titleblock(`오늘의 방송 ${listening.length}개`, '뉴스 듣기'),
    label('음성', listening.length),
    listening.length
      ? list(listening.map(p => row({ title: p.title, sub: prettyShow(p.show), key: keyOf(p), onSelect: () => playAndOpen(p, listening) })))
      : emptyBlock('아직 없습니다.', '오늘 방송이 아직 준비되지 않았어요.'));
  markPlaying();
}

async function renderRead() {
  if (!await ensureLatest(rootBar, renderRead)) return;
  const reading = state.latest.programs.filter(p => !isMedia(p));
  setView(
    rootBar(),
    titleblock('오늘의 헤드라인', '기사 읽기'),
    label('글', reading.length),
    reading.length
      ? list(reading.map(p => row({ title: p.title, sub: subtitle(p), key: keyOf(p), onSelect: () => show(() => renderArticle(p), true) })))
      : emptyBlock('아직 없습니다.', '오늘 읽을 기사가 아직 없어요.'));
}

function renderLibrary() {
  const me = renderLibrary;
  const body = h('div');
  const tab = (id, text) => h('button', { class: 'pf-tab', role: 'tab', 'aria-selected': String(state.lib === id), onclick: () => { state.lib = id; renderLibrary(); } }, text);
  setView(
    rootBar(),
    titleblock(null, '보관함'),
    h('div', { class: 'pf-tabs', role: 'tablist' }, tab('past', '지난 목록'), tab('saved', '저장함')),
    body);
  if (state.lib === 'saved') fillSaved(body); else fillPast(body, me);
}

function fillSaved(body) {
  const saved = store.get();
  const listening = saved.filter(isMedia);
  if (!saved.length) { body.append(emptyBlock('아직 없습니다.', '기사나 방송 화면에서 "저장"을 누르면 여기에 모입니다. 저장한 자료는 이 기기에만 남아요.')); return; }
  body.append(label('저장함', saved.length), list(saved.map(p => row({
    title: p.title, sub: (isMedia(p) ? '음성 · ' : '글 · ') + subtitle(p), key: keyOf(p),
    onSelect: () => isMedia(p) ? playAndOpen(p, listening) : show(() => renderArticle(p), true),
  }))));
  markPlaying();
}

async function fillPast(body, me) {
  body.append(emptyBlock('불러오는 중…'));
  let editions;
  try { editions = (await fetchJSON('data/archive/index.json')).editions; }
  catch { if (curFn() === me && state.lib === 'past') body.replaceChildren(emptyBlock('불러오지 못했습니다.', '잠시 후 다시 시도해 주세요.', '다시 시도', () => renderLibrary())); return; }
  if (!state.latest) { try { state.latest = await fetchJSON('data/current.json'); } catch {} }
  if (curFn() !== me || state.lib !== 'past') return;
  const past = editions.filter(e => !state.latest || e.id !== state.latest.id);
  if (!past.length) { body.replaceChildren(emptyBlock('아직 없습니다.', '새 목록은 매일 만들어지고, 이전 목록은 여기에 쌓입니다.')); return; }
  body.replaceChildren(label('지난 목록', past.length), list(past.map(e => row({
    title: editionLabel(e.id), sub: e.titles.join(' · '),
    onSelect: async () => {
      try { const ed = await fetchJSON(`data/archive/${encodeURIComponent(e.id)}.json`); show(() => renderEdition(ed), true); }
      catch { flash('불러오지 못했습니다.'); }
    },
  }))));
}

function renderEdition(ed) {
  const listening = ed.programs.filter(isMedia);
  const reading = ed.programs.filter(p => !isMedia(p));
  setView(
    backBar(),
    titleblock('지난 목록', editionLabel(ed.id)),
    listening.length ? label('음성', listening.length) : null,
    listening.length ? list(listening.map(p => row({ title: p.title, sub: prettyShow(p.show), key: keyOf(p), onSelect: () => playAndOpen(p, listening) }))) : null,
    reading.length ? label('글', reading.length) : null,
    reading.length ? list(reading.map(p => row({ title: p.title, sub: subtitle(p), key: keyOf(p), onSelect: () => show(() => renderArticle(p), true) }))) : null);
  markPlaying();
}

function renderArticle(p) {
  const paras = p.summary ? [p.summary] : (p.paragraphs || []).map(t => t.replace(/[{}]/g, ''));
  const rows = [];
  if (hasLink(p)) rows.push(textRow(`원문 열기 (${src(p).short})`, () => window.open(p.source, '_blank', 'noopener'), 'arrow-up-right'));
  rows.push(saveRow(p));
  let hero = null;
  if (p.image && /^https:\/\//.test(p.image)) {
    const img = h('img', { src: p.image, alt: '', decoding: 'async' });
    img.addEventListener('error', () => hero.remove());
    hero = h('div', { class: 'sc-hero' }, img);
  }
  setView(
    backBar(),
    titleblock(subtitle(p), p.title, 'sc-heading'),
    hero,
    h('div', { class: 'sc-text' }, paras.map(t => h('p', null, t))),
    h('p', { class: 'pf-row-sub sc-note' }, '기사 본문은 저작권 때문에 원문 사이트에서 읽습니다.'),
    list(rows));
}

function renderSettings() {
  const state_ = h('span', { class: 'sc-arrow' }, sound.on ? '켜짐' : '꺼짐');
  const b = h('button', { class: 'pf-row sc-row' }, h('span', { class: 'sc-body' }, h('span', { class: 'sc-title' }, '클릭 소리')), state_);
  b.addEventListener('click', () => {
    sound.on = !sound.on;
    try { localStorage.setItem('onair.click', sound.on ? '1' : '0'); } catch {}
    state_.textContent = sound.on ? '켜짐' : '꺼짐';
    clickSound();
  });
  setView(backBar(), titleblock(null, '설정'), label('소리'), list([b]));
}

function renderPlayer() {
  const p = state.current;
  if (!p) { setView(backBar(), emptyBlock('아직 없습니다.', '재생 중인 방송이 없어요.')); return; }
  const rows = [textRow('다음 방송', playNext, 'arrow-right')];
  if (hasLink(p)) rows.push(textRow(`원문 열기 (${src(p).short})`, () => window.open(p.source, '_blank', 'noopener'), 'arrow-up-right'));
  rows.push(saveRow(p));
  const seekBtn = (text, aria, sec) => h('button', { class: 'pf-action sc-seek', 'aria-label': aria, onclick: () => { clickSound(); seekBy(sec); } }, text);
  const bar = h('div', { class: 'sc-progress', id: 'npBar', role: 'slider', 'aria-label': '재생 위치' }, h('div', { class: 'sc-pos', id: 'npPos' }));
  let dragging = false;
  const seekTo = e => {
    const r = bar.getBoundingClientRect();
    if (media.duration) media.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * media.duration;
  };
  bar.addEventListener('pointerdown', e => { dragging = true; try { bar.setPointerCapture(e.pointerId); } catch {} seekTo(e); });
  bar.addEventListener('pointermove', e => { if (dragging) seekTo(e); });
  ['pointerup', 'pointercancel'].forEach(t => bar.addEventListener(t, () => { dragging = false; }));
  setView(
    backBar(),
    p.media === 'video' ? h('div', { class: 'sc-vspace' }) : null,
    h('div', { class: 'sc-info' },
      thumb(p, 96),
      h('div', { class: 'sc-meta' },
        h('div', { class: 'pf-eyebrow pf-now' }, p.media === 'video' ? '영상' : '음성'),
        h('div', { class: 'pf-row-sub' }, `${prettyShow(p.show)} · ${src(p).short}`))),
    h('h1', { class: 'sc-ptitle' }, p.title),
    bar,
    h('div', { class: 'sc-times' }, h('span', { id: 'tNow' }, '0:00'), h('span', { id: 'tLeft' }, '-0:00')),
    h('div', { class: 'sc-transport' },
      seekBtn('−15', '15초 뒤로', -15), seekBtn('−5', '5초 뒤로', -5),
      h('button', { class: 'sc-play', id: 'npPlay', onclick: () => { clickSound(); togglePlay(); } }, sym('play'), 'PLAY'),
      seekBtn('+5', '5초 앞으로', 5), seekBtn('+15', '15초 앞으로', 15)),
    list(rows));
  updateNP();
  syncPlayState();
}

function updateNP() {
  const pos = $('npPos');
  if (!pos) return;
  const r = media.duration ? Math.min(1, media.currentTime / media.duration) : 0;
  pos.style.left = `calc((100% - 4px) * ${r})`;
  $('tNow').textContent = fmtTime(media.currentTime);
  $('tLeft').textContent = '-' + fmtTime((media.duration || 0) - media.currentTime);
}

// ---------- 재생 ----------
const media = $('media');
const fmtTime = s => !isFinite(s) || s < 0 ? '0:00' : `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const playerShown = () => curFn() === renderPlayer;

function seekBy(sec) {
  if (!media.duration) return;
  media.currentTime = Math.max(0, Math.min(media.duration, media.currentTime + sec));
}
const togglePlay = () => {
  if (!state.current) { flash('재생 중인 방송이 없어요'); return; }
  return media.paused ? media.play().catch(() => {}) : media.pause();
};

function play(p, queue) {
  const same = state.current && keyOf(state.current) === keyOf(p);
  state.queue = queue && queue.length ? queue : [p];
  if (!same) {
    state.current = p;
    media.src = p.src;
    setMediaMetadata(p);
    $('miniTitle').textContent = p.title;
  }
  media.play().catch(() => {});
  markPlaying();
  syncChrome();
}
function playAndOpen(p, queue) {
  play(p, queue);
  if (playerShown()) renderPlayer();
  else show(renderPlayer, true);
}

function setMediaMetadata(p) {
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: p.title, artist: src(p).short, album: 'Script',
      artwork: p.image ? [{ src: p.image, sizes: '480x480' }] : [],
    });
  }
}

function playNext() {
  if (!state.current) return;
  const i = state.queue.findIndex(x => keyOf(x) === keyOf(state.current));
  const next = state.queue[i + 1];
  if (!next) { flash('마지막 방송이에요'); return; }
  play(next, state.queue);
  if (playerShown()) renderPlayer();
}

function syncPlayState() {
  const text = media.paused ? 'PLAY' : 'STOP';
  const label = media.paused ? '재생' : '정지';
  const s_ = media.paused ? 'play' : 'stop';
  $('miniPlay').replaceChildren(sym(s_), text); $('miniPlay').setAttribute('aria-label', label);
  const np = $('npPlay');
  if (np) { np.replaceChildren(sym(s_), text); np.setAttribute('aria-label', label); }
  if ('mediaSession' in navigator && state.current) {
    navigator.mediaSession.playbackState = media.paused ? 'paused' : 'playing';
  }
}
media.addEventListener('timeupdate', () => { if (playerShown()) updateNP(); });
media.addEventListener('play', syncPlayState);
media.addEventListener('pause', syncPlayState);
media.addEventListener('loadedmetadata', () => { if (playerShown()) updateNP(); });
media.addEventListener('ended', () => {
  const i = state.queue.findIndex(x => keyOf(x) === keyOf(state.current));
  if (state.queue[i + 1]) playNext();
  else if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'none'; // 다음 곡이 없으면 Now Playing 정리
});

if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => media.play());
  navigator.mediaSession.setActionHandler('pause', () => media.pause());
  navigator.mediaSession.setActionHandler('seekbackward', () => seekBy(-15));
  navigator.mediaSession.setActionHandler('seekforward', () => seekBy(15));
  navigator.mediaSession.setActionHandler('nexttrack', playNext);
  navigator.mediaSession.setActionHandler('seekto', e => { if (e.seekTime != null) media.currentTime = e.seekTime; });
}

// 앱이 완전히 닫힐 때(pagehide)만 재생 상태를 정리한다. 화면이 숨겨질 때(visibilitychange)는 백그라운드 재생을 위해 멈추지 않는다.
window.addEventListener('pagehide', e => {
  if (e.persisted || !('mediaSession' in navigator)) return;
  media.pause();
  navigator.mediaSession.playbackState = 'none';
  navigator.mediaSession.metadata = null;
});

// ---------- 클릭 소리·진동 (설정에서 켜고 끔, 기본은 꺼짐) ----------
const sound = { on: (() => { try { return localStorage.getItem('onair.click') === '1'; } catch { return false; } })(), ctx: null };
function beep(freq, dur, vol) {
  if (!sound.on) return;
  try {
    const c = sound.ctx || (sound.ctx = new (window.AudioContext || window.webkitAudioContext)());
    if (c.state === 'suspended') c.resume();
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + dur);
  } catch {}
}
const vibe = ms => { try { if (sound.on && navigator.vibrate) navigator.vibrate(ms); } catch {} };
const clickSound = () => { beep(1100, 0.03, 0.05); vibe(10); };

// ---------- 새 버전 알림 ----------
// 배포할 때 워크플로가 APP_VERSION과 version.json을 같은 값(커밋 SHA)으로 채운다. 채워지지 않은 로컬 파일에서는 확인하지 않는다.
const APP_VERSION = '__APP_VERSION__';
const updateBar = $('update');
const laterKey = 'script.update.later';
const laterSeen = new Set();
const getLater = () => { try { return sessionStorage.getItem(laterKey); } catch { return null; } };
function showUpdate(version) {
  updateBar.dataset.version = version;
  updateBar.hidden = false;
  document.documentElement.style.setProperty('--sc-update-h', updateBar.offsetHeight + 'px');
}
function hideUpdate() {
  updateBar.hidden = true;
  document.documentElement.style.setProperty('--sc-update-h', '0px');
}
async function checkVersion() {
  if (APP_VERSION.startsWith('__')) return;
  try {
    const r = await fetch('version.json', { cache: 'no-store' });
    if (!r.ok) return;
    const { version } = await r.json();
    if (!version || version === APP_VERSION) { hideUpdate(); return; }
    if (laterSeen.has(version) || getLater() === version) return;
    showUpdate(version);
  } catch {}  // 오프라인이거나 못 받으면 아무것도 띄우지 않는다
}
updateBar.querySelector('.pf-update-later').addEventListener('click', () => {
  const v = updateBar.dataset.version;
  laterSeen.add(v);
  try { sessionStorage.setItem(laterKey, v); } catch {}
  hideUpdate();
});
updateBar.querySelector('.pf-update-reload').addEventListener('click', async () => {
  try {
    const reg = 'serviceWorker' in navigator ? await navigator.serviceWorker.getRegistration() : null;
    if (reg) { await reg.update(); if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' }); }
  } catch {}
  location.reload();
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkVersion(); });
setInterval(checkVersion, 5 * 60 * 1000);
checkVersion();

// ---------- 시작 ----------
$('miniOpen').addEventListener('click', () => { if (!playerShown()) show(renderPlayer, true); });
$('miniPlay').addEventListener('click', togglePlay);
document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
setTab('listen');

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
