<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>On Air English</title>
<meta name="description" content="매일 새로 바뀌는 BBC·NPR 영어 뉴스">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="On Air">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- 뉴스 팟캐스트는 집계용 리다이렉트를 여러 번 거치므로 미리 연결해 둔다 -->
<link rel="preconnect" href="https://open.live.bbc.co.uk">
<link rel="preconnect" href="https://bbc.pdn.tritondigital.com">
<link rel="preconnect" href="https://prfx.byspotify.com">
<link rel="preconnect" href="https://play.podtrac.com">
<link rel="preconnect" href="https://npr.simplecastaudio.com">
<link rel="preconnect" href="https://ichef.bbci.co.uk">
<link rel="dns-prefetch" href="https://npr.brightspotcdn.com">
<link rel="dns-prefetch" href="https://media.npr.org">
<style>
  :root {
    --accent: #FA2D48;
    --bg: #FFFFFF; --bg-2: #F2F2F7;
    --ink: #000000; --ink-2: #8A8A8E; --ink-3: #C7C7CC;
    --sep: rgba(60, 60, 67, 0.18);
    --gloss-bg: rgba(250, 45, 72, 0.10);
    --blur-bg: rgba(249, 249, 249, 0.88);
    --tab-h: 56px; --mini-h: 64px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --bg-2: #1C1C1E;
      --ink: #FFFFFF; --ink-2: #98989F; --ink-3: #48484A;
      --sep: rgba(84, 84, 88, 0.55);
      --gloss-bg: rgba(250, 45, 72, 0.22);
      --blur-bg: rgba(22, 22, 24, 0.9);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Segoe UI", "Noto Sans KR", sans-serif;
    font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  a { color: var(--accent); text-decoration: none; }
  svg.i { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }

  #view {
    max-width: 560px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 20px calc(var(--tab-h) + var(--mini-h) + var(--safe-b) + 28px);
  }
  body.no-mini #view { padding-bottom: calc(var(--tab-h) + var(--safe-b) + 24px); }

  /* ---------- 머리말 ---------- */
  .topbar { display: flex; justify-content: space-between; align-items: center; min-height: 28px; margin-bottom: 4px; }
  .eyebrow { font-size: 13px; color: var(--ink-2); }
  .icon-btn { color: var(--accent); font-size: 26px; display: inline-flex; padding: 2px; }
  .topbar .save-btn { color: var(--accent); font-size: 24px; }
  .large-title { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; margin: 2px 0 18px; }
  .section-head { display: flex; justify-content: space-between; align-items: baseline; margin: 26px 0 10px; }
  .section-head h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
  .section-head span { font-size: 15px; color: var(--ink-2); }

  /* ---------- 아트워크 ---------- */
  .art {
    flex-shrink: 0; border-radius: 6px; display: flex; align-items: center; justify-content: center;
    background: var(--art-bg); color: var(--art-fg); font-weight: 800; letter-spacing: -0.02em; overflow: hidden;
    position: relative;
  }
  .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .row .art.wide { width: 88px; }

  /* ---------- 헤드라인 화면 ---------- */
  .hero { width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; margin: 8px 0 16px; font-size: 40px; }
  .article-meta { font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }
  .article-title { font-size: 26px; line-height: 1.22; font-weight: 700; letter-spacing: -0.015em; margin: 0 0 14px; }
  .read-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin: 22px 0 10px;
    background: var(--accent); color: #fff; font-size: 17px; font-weight: 600; border-radius: 12px; padding: 14px;
  }
  .note { font-size: 13px; color: var(--ink-2); text-align: center; }

  /* ---------- 듣기 가로 스크롤 ---------- */
  .shelf { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 20px; margin: 0 -20px; padding: 0 20px 4px; scrollbar-width: none; }
  .shelf::-webkit-scrollbar { display: none; }
  .tile { width: 156px; flex-shrink: 0; scroll-snap-align: start; text-align: left; }
  .tile .art { width: 156px; height: 156px; border-radius: 10px; font-size: 34px; position: relative; }
  .tile .kind { position: absolute; right: 8px; bottom: 8px; font-size: 11px; font-weight: 600; letter-spacing: 0; background: rgba(0,0,0,0.28); color: #fff; border-radius: 20px; padding: 2px 8px; }
  .tile .t { font-size: 14px; margin-top: 7px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tile .s { font-size: 13px; color: var(--ink-2); }
  .tile.playing .t { color: var(--accent); }

  /* ---------- 목록 행 ---------- */
  .rows { border-top: 0.5px solid var(--sep); }
  .row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 8px 0; border-bottom: 0.5px solid var(--sep); }
  .row .art { width: 52px; height: 52px; font-size: 14px; }
  .row .body { flex: 1; min-width: 0; }
  .row .t { font-size: 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row .s { font-size: 13px; color: var(--ink-2); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.playing .t { color: var(--accent); }
  .save-btn { color: var(--ink-3); font-size: 22px; padding: 6px; display: inline-flex; }
  .save-btn.on { color: var(--accent); }
  .save-btn.on svg.i { fill: currentColor; }
  .empty { color: var(--ink-2); font-size: 15px; text-align: center; padding: 48px 12px; line-height: 1.6; }
  .empty b { display: block; color: var(--ink); font-size: 20px; margin-bottom: 4px; }

  /* ---------- 읽기 화면 ---------- */
  .reader-head { display: flex; gap: 14px; align-items: center; margin: 10px 0 12px; }
  .reader-head .art { width: 72px; height: 72px; font-size: 18px; border-radius: 8px; }
  .reader-head .s { font-size: 13px; color: var(--ink-2); }
  .reader-head h1 { font-size: 22px; line-height: 1.25; font-weight: 700; margin: 2px 0 0; letter-spacing: -0.01em; }
  .credit { font-size: 13px; color: var(--ink-2); margin: 0 0 18px; line-height: 1.5; }
  .prose { font-family: "New York", ui-serif, Georgia, "Noto Serif KR", serif; font-size: 19px; line-height: 1.65; }
  .prose p { margin: 0 0 18px; }
  .gloss { background: var(--gloss-bg); color: var(--accent); border-radius: 4px; padding: 0 2px; cursor: pointer; }
  .gloss-card { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg-2); border-radius: 12px; padding: 12px 14px; margin: -6px 0 18px; }
  .gloss-card b { display: block; font-size: 16px; }
  .gloss-card span { font-size: 15px; color: var(--ink-2); line-height: 1.45; }

  /* ---------- 미니 플레이어 ---------- */
  #mini {
    position: fixed; left: 0; right: 0; bottom: calc(var(--tab-h) + var(--safe-b)); z-index: 20;
    padding: 0 8px 6px; pointer-events: none;
  }
  #mini .card {
    pointer-events: auto; max-width: 544px; margin: 0 auto; height: 58px; border-radius: 14px; cursor: pointer;
    background: var(--blur-bg); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    box-shadow: 0 4px 18px rgba(0,0,0,0.14); display: flex; align-items: center; gap: 12px; padding: 0 10px 0 8px;
  }
  #mini .art { width: 42px; height: 42px; font-size: 12px; }
  #mini .t { flex: 1; min-width: 0; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
  #mini .ctl { font-size: 26px; display: inline-flex; padding: 6px; }
  body.no-mini #mini { display: none; }

  /* ---------- 탭 바 ---------- */
  #tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; height: calc(var(--tab-h) + var(--safe-b));
    padding-bottom: var(--safe-b); display: flex; justify-content: center;
    background: var(--blur-bg); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-top: 0.5px solid var(--sep);
  }
  #tabs .wrap { display: flex; width: 100%; max-width: 560px; }
  #tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--ink-2); font-size: 11px; }
  #tabs button svg.i { font-size: 25px; }
  #tabs button.on { color: var(--accent); }

  /* ---------- 지금 재생 ---------- */
  #player {
    position: fixed; inset: 0; z-index: 40; color: #fff; overflow-y: auto;
    background: #1c1c1e; background: color-mix(in srgb, var(--art-bg, #333) 42%, #000);
    transform: translateY(100%); transition: transform 0.32s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0.32s; visibility: hidden;
  }
  #player.open { transform: none; visibility: visible; }
  #player .inner {
    max-width: 480px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 28px calc(var(--safe-b) + 24px);
  }
  #player .grab { align-self: center; color: rgba(255,255,255,0.7); font-size: 30px; display: inline-flex; margin-bottom: 14px; }
  #stage { position: relative; width: 100%; aspect-ratio: 1; margin-bottom: 26px; }
  #stage .art { width: 100%; height: 100%; border-radius: 12px; font-size: 64px; box-shadow: 0 18px 40px rgba(0,0,0,0.35); }
  #stage video { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 12px; background: #000; object-fit: contain; }
  #stage.is-video { aspect-ratio: 16 / 9; }
  #stage.is-video .art { display: none; }
  #stage:not(.is-video) video { opacity: 0; pointer-events: none; }
  #pTitle { font-size: 20px; font-weight: 700; line-height: 1.25; }
  #pSource { font-size: 17px; color: rgba(255,255,255,0.6); margin: 2px 0 20px; }
  #seek { width: 100%; margin: 0; accent-color: #fff; height: 20px; }
  .times { display: flex; justify-content: space-between; font-size: 12px; color: rgba(255,255,255,0.6); font-variant-numeric: tabular-nums; }
  .transport { display: flex; justify-content: center; align-items: center; gap: 44px; margin: 22px 0 28px; }
  .transport button { display: inline-flex; color: #fff; }
  .transport .skip { font-size: 34px; }
  .transport .main { font-size: 52px; }
  .extras { display: flex; justify-content: space-around; align-items: center; margin-top: auto; }
  .extras button, .extras a { color: rgba(255,255,255,0.75); font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 20px; }
  .extras button { background: rgba(255,255,255,0.14); min-width: 58px; justify-content: center; }
</style>
</head>
<body class="no-mini">

<main id="view"></main>

<div id="mini">
  <div class="card" id="miniCard">
    <div class="art" id="miniArt"></div>
    <div class="t" id="miniTitle"></div>
    <button class="ctl" id="miniPlay" aria-label="재생"></button>
    <button class="ctl" id="miniNext" aria-label="다음"></button>
  </div>
</div>

<nav id="tabs">
  <div class="wrap">
    <button data-tab="today" class="on"></button>
    <button data-tab="archive"></button>
    <button data-tab="saved"></button>
  </div>
</nav>

<section id="player" aria-label="지금 재생">
  <div class="inner">
    <button class="grab" id="pClose" aria-label="닫기"></button>
    <div id="stage">
      <div class="art" id="pArt"></div>
      <video id="media" playsinline preload="metadata"></video>
    </div>
    <div id="pTitle"></div>
    <div id="pSource"></div>
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="재생 위치">
    <div class="times"><span id="tNow">0:00</span><span id="tLeft">-0:00</span></div>
    <div class="transport">
      <button class="skip" id="pBack" aria-label="15초 뒤로"></button>
      <button class="main" id="pPlay" aria-label="재생"></button>
      <button class="skip" id="pFwd" aria-label="15초 앞으로"></button>
    </div>
    <div class="extras">
      <button id="pSpeed" aria-label="재생 속도">1x</button>
      <a id="pLink" target="_blank" rel="noopener"></a>
    </div>
  </div>
</section>

<script>
const INTERVAL_DAYS = 1;
const SPEEDS = [1, 1.25, 1.5, 0.75];

// ---------- 아이콘 ----------
const ICONS = {
  play: '<path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z" fill="currentColor" stroke="none"/>',
  pause: '<rect x="5.5" y="4" width="4.5" height="16" rx="1.2" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4.5" height="16" rx="1.2" fill="currentColor" stroke="none"/>',
  next: '<path d="M2.5 6v12a1 1 0 0 0 1.55.83L12 13.5V18a1 1 0 0 0 1.55.83l8.5-6a1 1 0 0 0 0-1.66l-8.5-6A1 1 0 0 0 12 6v4.5L4.05 5.17A1 1 0 0 0 2.5 6z" fill="currentColor" stroke="none"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  down: '<path d="M6 9l6 6 6-6"/>',
  bookmark: '<path d="M18 7v14l-6-4-6 4V7a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4z"/>',
  radio: '<circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49M7.76 16.24a6 6 0 0 1 0-8.49M19.07 4.93a10 10 0 0 1 0 14.14M4.93 19.07a10 10 0 0 1 0-14.14"/>',
  history: '<path d="M12 8v4l3 2"/><path d="M3.05 11a9 9 0 1 1 .5 4"/><path d="M3 4v5h5"/>',
  rew: '<path d="M4 4v5h5"/><path d="M4.6 9A8.5 8.5 0 1 1 3.5 13"/><text x="13" y="15.5" font-size="7" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none" font-family="-apple-system,sans-serif">15</text>',
  fwd: '<path d="M20 4v5h-5"/><path d="M19.4 9A8.5 8.5 0 1 0 20.5 13"/><text x="11" y="15.5" font-size="7" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none" font-family="-apple-system,sans-serif">15</text>',
  link: '<path d="M12 6H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/><path d="M11 13l9-9"/><path d="M15 4h5v5"/>',
};
function icon(name) {
  const t = document.createElement('template');
  t.innerHTML = `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;
  return t.content.firstChild;
}

function h(tag, attrs, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c != null && c !== false) e.append(c);
  return e;
}
const $ = id => document.getElementById(id);

// ---------- 출처별 아트워크 ----------
const SOURCES = {
  'VOA Learning English':         { short: 'VOA',           mark: 'VOA',  bg: '#534AB7', fg: '#EEEDFE' },
  'manythings.org':               { short: 'VOA',           mark: 'VOA',  bg: '#534AB7', fg: '#EEEDFE' },
  'NASA Image and Video Library': { short: 'NASA',          mark: 'NASA', bg: '#185FA5', fg: '#E6F1FB' },
  'NASA Science':                 { short: 'NASA',          mark: 'NASA', bg: '#0F6E56', fg: '#E1F5EE' },
  'Global Voices':                { short: 'Global Voices', mark: 'GV',   bg: '#993C1D', fg: '#FAECE7' },
  'Simple English Wikipedia':     { short: 'Wikipedia',     mark: 'W',    bg: '#444441', fg: '#F1EFE8' },
  'Wikimedia Commons':            { short: 'Wikimedia',     mark: 'W',    bg: '#5F5E5A', fg: '#F1EFE8' },
  'LibriVox':                     { short: 'LibriVox',      mark: 'LV',   bg: '#993556', fg: '#FBEAF0' },
  'Internet Archive (LibriVox)':  { short: 'LibriVox',      mark: 'LV',   bg: '#993556', fg: '#FBEAF0' },
  'BBC':                          { short: 'BBC',           mark: 'BBC',  bg: '#2C2C2A', fg: '#FFFFFF' },
  'BBC News':                     { short: 'BBC News',      mark: 'BBC',  bg: '#A32D2D', fg: '#FFFFFF' },
  'NPR':                          { short: 'NPR',           mark: 'NPR',  bg: '#0C447C', fg: '#FFFFFF' },
};
const src = p => SOURCES[p.sourceName] || { short: p.sourceName || '', mark: (p.show || '?').slice(0, 2), bg: '#5F5E5A', fg: '#F1EFE8' };
const isMedia = p => p.type === 'video';
const kindLabel = p => p.media === 'video' ? '영상' : '오디오';
const keyOf = p => p.src || p.source || p.title;

function paint(el, p) {
  const s = src(p);
  el.style.setProperty('--art-bg', s.bg);
  el.style.setProperty('--art-fg', s.fg);
  return el;
}
function art(p, extraClass) {
  const a = paint(h('div', { class: 'art' + (extraClass ? ' ' + extraClass : '') }, src(p).mark), p);
  if (p.image && /^https:\/\//.test(p.image)) {
    const img = h('img', { src: p.image, alt: '', loading: 'lazy', decoding: 'async' });
    img.addEventListener('error', () => img.remove());
    a.append(img);
  }
  return a;
}

function readMinutes(p) {
  const words = (p.paragraphs || []).join(' ').split(/\s+/).length;
  return Math.max(1, Math.round(words / 130));
}
const minutes = p => p.duration ? `${Math.max(1, Math.round(p.duration / 60))}분` : kindLabel(p);
function subtitle(p) {
  if (isMedia(p)) return `${src(p).short} · ${minutes(p)}`;
  if (p.type === 'link') return `${src(p).short}${p.date ? ' · ' + fmtDate(p.date) : ''}`;
  return `${src(p).short} · ${readMinutes(p)}분 읽기`;
}

// ---------- 저장함 (이 기기에만 저장) ----------
const store = {
  get() { try { return JSON.parse(localStorage.getItem('onair.saved') || '[]'); } catch { return []; } },
  set(list) { try { localStorage.setItem('onair.saved', JSON.stringify(list)); } catch {} },
};
const isSaved = p => store.get().some(x => keyOf(x) === keyOf(p));
function toggleSave(p) {
  const list = store.get();
  const i = list.findIndex(x => keyOf(x) === keyOf(p));
  if (i >= 0) list.splice(i, 1); else list.unshift(p);
  store.set(list);
  return i < 0;
}
function saveButton(p) {
  const b = h('button', { class: 'save-btn' + (isSaved(p) ? ' on' : ''), 'aria-label': '저장' }, icon('bookmark'));
  b.addEventListener('click', e => { e.stopPropagation(); b.classList.toggle('on', toggleSave(p)); });
  return b;
}

// ---------- 데이터 ----------
const state = { latest: null, tab: 'today', stack: [], queue: [], current: null };

async function fetchJSON(url) {
  const r = await fetch(url, { cache: 'no-cache' });
  if (!r.ok) throw new Error(r.status + ' ' + url);
  return r.json();
}

const DAYS = ['일', '월', '화', '수', '목', '금', '토'];
function fmtDate(iso, withDay) {
  const d = new Date(iso + 'T00:00:00');
  return `${d.getMonth() + 1}월 ${d.getDate()}일` + (withDay ? ` ${DAYS[d.getDay()]}요일` : '');
}
function nextDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + INTERVAL_DAYS);
  return `${d.getMonth() + 1}월 ${d.getDate()}일`;
}
const editionLabel = id => fmtDate(id.slice(0, 10)) + (id.length > 10 ? ` (${id.slice(11)})` : '');

// ---------- 화면 전환 ----------
const view = $('view');

function show(render, push) {
  if (push) {
    state.stack.push(render);
    history.pushState({ depth: state.stack.length }, '');
  } else {
    state.stack = [render];
  }
  render();
  window.scrollTo(0, 0);
}
const goBack = () => history.back();
window.addEventListener('popstate', () => {
  if (state.ignorePop) { state.ignorePop = false; return; }  // 닫기 버튼으로 플레이어를 닫은 경우
  if (player.classList.contains('open')) { closePlayer(true); return; }
  if (state.stack.length > 1) {
    state.stack.pop();
    state.stack[state.stack.length - 1]();
  }
});

function setTab(tab) {
  state.tab = tab;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  show({ today: renderToday, archive: renderArchive, saved: renderSaved }[tab], false);
}

function row(p, queue) {
  const b = h('button', { class: 'row', 'data-key': keyOf(p) },
    art(p, p.type === 'link' && p.image ? 'wide' : ''),
    h('div', { class: 'body' }, h('div', { class: 't' }, p.title), h('div', { class: 's' }, subtitle(p))),
    saveButton(p));
  b.addEventListener('click', () => {
    if (isMedia(p)) play(p, queue);
    else if (p.type === 'link') show(() => renderArticle(p), true);
    else show(() => renderReader(p), true);
  });
  return b;
}

function tile(p, queue) {
  const a = art(p);
  a.append(h('span', { class: 'kind' }, minutes(p)));
  const b = h('button', { class: 'tile', 'data-key': keyOf(p) },
    a, h('div', { class: 't' }, p.title), h('div', { class: 's' }, src(p).short));
  b.addEventListener('click', () => play(p, queue));
  return b;
}

function renderEdition(ed, past) {
  const listening = ed.programs.filter(isMedia);
  const reading = ed.programs.filter(p => !isMedia(p));
  const top = past
    ? h('div', { class: 'topbar' }, h('button', { class: 'icon-btn', onclick: goBack, 'aria-label': '뒤로' }, icon('back')))
    : h('div', { class: 'topbar' }, h('span', { class: 'eyebrow' }, `${fmtDate(ed.date, true)} · 다음 목록 ${nextDate(ed.date)}`));
  view.replaceChildren(
    top,
    h('h1', { class: 'large-title' }, past ? `${editionLabel(ed.id)} 목록` : '오늘의 영어'),
    listening.length ? h('div', { class: 'section-head' }, h('h2', null, '뉴스 듣기'), h('span', null, `${listening.length}개`)) : null,
    listening.length ? h('div', { class: 'shelf' }, listening.map(p => tile(p, listening))) : null,
    h('div', { class: 'section-head' }, h('h2', null, reading.some(p => p.type === 'link') ? '헤드라인' : '읽기'), h('span', null, `${reading.length}개`)),
    h('div', { class: 'rows' }, reading.map(p => row(p, listening))),
  );
  markPlaying();
}

async function renderToday() {
  if (!state.latest) {
    try { state.latest = await fetchJSON('data/current.json'); }
    catch {
      view.replaceChildren(h('div', { class: 'empty' }, h('b', null, '목록을 불러오지 못했어요'), '인터넷 연결을 확인한 뒤 다시 열어 주세요.'));
      return;
    }
  }
  if (state.tab === 'today' && state.stack.length === 1) renderEdition(state.latest, false);
}

async function renderArchive() {
  view.replaceChildren(h('div', { class: 'topbar' }), h('h1', { class: 'large-title' }, '지난 목록'));
  let editions;
  try { editions = (await fetchJSON('data/archive/index.json')).editions; }
  catch { view.append(h('div', { class: 'empty' }, h('b', null, '불러오지 못했어요'), '잠시 후 다시 시도해 주세요.')); return; }
  if (state.tab !== 'archive' || state.stack.length > 1) return;
  if (!state.latest) { try { state.latest = await fetchJSON('data/current.json'); } catch {} }
  const past = editions.filter(e => !state.latest || e.id !== state.latest.id);
  if (!past.length) {
    view.append(h('div', { class: 'empty' }, h('b', null, '아직 지난 목록이 없어요'), `새 목록은 ${INTERVAL_DAYS}일마다 만들어지고, 이전 목록은 여기에 쌓입니다.`));
    return;
  }
  view.append(h('div', { class: 'rows' }, past.map(e => {
    const d = new Date(e.date + 'T00:00:00');
    const a = h('div', { class: 'art', style: 'flex-direction:column;line-height:1;font-size:20px' },
      h('span', { style: 'font-size:10px;font-weight:700;margin-bottom:3px' }, `${d.getMonth() + 1}월`), String(d.getDate()));
    a.style.setProperty('--art-bg', '#FA2D48');
    a.style.setProperty('--art-fg', '#FFFFFF');
    const b = h('button', { class: 'row' }, a,
      h('div', { class: 'body' }, h('div', { class: 't' }, `${editionLabel(e.id)} 목록`), h('div', { class: 's' }, e.titles.join(' · '))));
    b.addEventListener('click', async () => {
      try {
        const ed = await fetchJSON(`data/archive/${encodeURIComponent(e.id)}.json`);
        show(() => renderEdition(ed, true), true);
      } catch {}
    });
    return b;
  })));
}

function renderSaved() {
  const list = store.get();
  view.replaceChildren(h('div', { class: 'topbar' }), h('h1', { class: 'large-title' }, '저장함'));
  if (!list.length) {
    view.append(h('div', { class: 'empty' }, h('b', null, '저장한 자료가 없어요'), '목록에서 책갈피를 누르면 여기에 모입니다. 저장한 자료는 이 기기에만 남아요.'));
    return;
  }
  const listening = list.filter(isMedia);
  view.append(h('div', { class: 'rows' }, list.map(p => row(p, listening))));
  markPlaying();
}

function renderArticle(p) {
  const hasLink = p.source && /^https?:\/\//.test(p.source);
  view.replaceChildren(
    h('div', { class: 'topbar' },
      h('button', { class: 'icon-btn', onclick: goBack, 'aria-label': '뒤로' }, icon('back')),
      saveButton(p)),
    art(p, 'hero'),
    h('div', { class: 'article-meta' }, subtitle(p)),
    h('h1', { class: 'article-title' }, p.title),
    p.summary ? h('div', { class: 'prose' }, h('p', null, p.summary)) : null,
    hasLink ? h('a', { class: 'read-btn', href: p.source, target: '_blank', rel: 'noopener' }, `${src(p).short}에서 기사 읽기`, icon('link')) : null,
    h('p', { class: 'note' }, '기사 본문은 저작권 때문에 원문 사이트에서 읽습니다.'),
  );
}

function renderReader(p) {
  const gloss = {};
  Object.entries(p.gloss || {}).forEach(([k, v]) => { gloss[k.toLowerCase()] = v; });
  const prose = h('div', { class: 'prose' });
  (p.paragraphs || []).forEach(raw => {
    const para = h('p');
    raw.split(/\{([^{}]+)\}/g).forEach((chunk, i) => {
      if (i % 2 === 0) { para.append(chunk); return; }
      const w = h('span', { class: 'gloss', role: 'button', tabindex: '0' }, chunk);
      w.addEventListener('click', () => {
        const next = para.nextElementSibling;
        const wasOpen = next && next.classList.contains('gloss-card') && next.dataset.word === chunk;
        prose.querySelectorAll('.gloss-card').forEach(c => c.remove());
        if (!wasOpen) para.after(h('div', { class: 'gloss-card', 'data-word': chunk }, h('b', null, chunk), h('span', null, gloss[chunk.toLowerCase()] || '')));
      });
      para.append(w);
    });
    prose.append(para);
  });
  const credit = h('p', { class: 'credit' }, p.credit || '');
  if (p.source && /^https?:\/\//.test(p.source)) credit.append(' · ', h('a', { href: p.source, target: '_blank', rel: 'noopener' }, '원문 보기'));
  view.replaceChildren(
    h('div', { class: 'topbar' },
      h('button', { class: 'icon-btn', onclick: goBack, 'aria-label': '뒤로' }, icon('back')),
      saveButton(p)),
    h('div', { class: 'reader-head' }, art(p),
      h('div', null, h('div', { class: 's' }, subtitle(p)), h('h1', null, p.title))),
    credit,
    prose,
  );
}

// ---------- 재생 ----------
const media = $('media');
const player = $('player');
let speedIndex = 0;

const setIcon = (el, name) => el.replaceChildren(icon(name));
const fmtTime = s => !isFinite(s) || s < 0 ? '0:00' : `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

function markPlaying() {
  const k = state.current && keyOf(state.current);
  view.querySelectorAll('[data-key]').forEach(e => e.classList.toggle('playing', e.dataset.key === k));
}

function play(p, queue) {
  const same = state.current && keyOf(state.current) === keyOf(p);
  state.queue = queue && queue.length ? queue : [p];
  if (!same) {
    state.current = p;
    media.src = p.src;
    media.playbackRate = SPEEDS[speedIndex];
    fillPlayer(p);
  }
  media.play().catch(() => {});
  document.body.classList.remove('no-mini');
  if (p.media === 'video' || same) openPlayer();
  markPlaying();
}

function fillPlayer(p) {
  const s = src(p);
  paint(player, p);
  for (const id of ['pArt', 'miniArt']) {
    const fresh = art(p);
    fresh.id = id;
    $(id).replaceWith(fresh);
  }
  $('stage').classList.toggle('is-video', p.media === 'video');
  $('pTitle').textContent = p.title;
  $('pSource').textContent = s.short;
  $('miniTitle').textContent = p.title;
  $('seek').value = 0;
  $('tNow').textContent = '0:00';
  $('tLeft').textContent = '-0:00';
  const link = $('pLink');
  link.replaceChildren(icon('link'), '원문');
  if (p.source && /^https?:\/\//.test(p.source)) { link.href = p.source; link.style.visibility = ''; }
  else link.style.visibility = 'hidden';
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: p.title, artist: s.short, album: 'On Air English',
      artwork: p.image ? [{ src: p.image, sizes: '480x480' }] : [],
    });
  }
}

function playNext() {
  if (!state.current) return;
  const i = state.queue.findIndex(x => keyOf(x) === keyOf(state.current));
  const next = state.queue[i + 1];
  if (next) play(next, state.queue);
}

function openPlayer() {
  if (player.classList.contains('open')) return;
  player.classList.add('open');
  history.pushState({ player: true }, '');
}
function closePlayer(fromPop) {
  if (!player.classList.contains('open')) return;
  player.classList.remove('open');
  if (!fromPop) { state.ignorePop = true; history.back(); }
}

function syncPlayState() {
  const name = media.paused ? 'play' : 'pause';
  setIcon($('pPlay'), name);
  setIcon($('miniPlay'), name);
  $('pPlay').setAttribute('aria-label', media.paused ? '재생' : '일시정지');
  $('miniPlay').setAttribute('aria-label', media.paused ? '재생' : '일시정지');
}

let seeking = false;
media.addEventListener('timeupdate', () => {
  if (seeking) return;
  $('seek').value = media.duration ? Math.round(media.currentTime / media.duration * 1000) : 0;
  $('tNow').textContent = fmtTime(media.currentTime);
  $('tLeft').textContent = '-' + fmtTime((media.duration || 0) - media.currentTime);
});
media.addEventListener('play', syncPlayState);
media.addEventListener('pause', syncPlayState);
media.addEventListener('ended', playNext);
$('seek').addEventListener('input', () => {
  seeking = true;
  $('tNow').textContent = fmtTime($('seek').value / 1000 * (media.duration || 0));
});
$('seek').addEventListener('change', () => {
  if (media.duration) media.currentTime = $('seek').value / 1000 * media.duration;
  seeking = false;
});

const togglePlay = () => media.paused ? media.play().catch(() => {}) : media.pause();
$('pPlay').addEventListener('click', togglePlay);
$('miniPlay').addEventListener('click', e => { e.stopPropagation(); togglePlay(); });
$('miniNext').addEventListener('click', e => { e.stopPropagation(); playNext(); });
$('miniCard').addEventListener('click', openPlayer);
$('pClose').addEventListener('click', () => closePlayer(false));
$('pBack').addEventListener('click', () => { media.currentTime = Math.max(0, media.currentTime - 15); });
$('pFwd').addEventListener('click', () => { media.currentTime = Math.min(media.duration || 0, media.currentTime + 15); });
$('pSpeed').addEventListener('click', () => {
  speedIndex = (speedIndex + 1) % SPEEDS.length;
  media.playbackRate = SPEEDS[speedIndex];
  $('pSpeed').textContent = SPEEDS[speedIndex] + 'x';
});

if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => media.play());
  navigator.mediaSession.setActionHandler('pause', () => media.pause());
  navigator.mediaSession.setActionHandler('seekbackward', () => { media.currentTime = Math.max(0, media.currentTime - 15); });
  navigator.mediaSession.setActionHandler('seekforward', () => { media.currentTime += 15; });
  navigator.mediaSession.setActionHandler('nexttrack', playNext);
}

// ---------- 시작 ----------
setIcon($('pClose'), 'down');
setIcon($('pBack'), 'rew');
setIcon($('pFwd'), 'fwd');
setIcon($('miniNext'), 'next');
syncPlayState();
const TAB_ICONS = { today: ['radio', '오늘'], archive: ['history', '지난 목록'], saved: ['bookmark', '저장함'] };
document.querySelectorAll('#tabs button').forEach(b => {
  const [ic, label] = TAB_ICONS[b.dataset.tab];
  b.append(icon(ic), label);
  b.addEventListener('click', () => setTab(b.dataset.tab));
});
setTab('today');

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
